name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
          global-json-file: global.json

      - name: Log .NET SDK and MSBuild SDK path
        shell: pwsh
        run: |
          dotnet --info
          if ((dotnet --version).Trim() -cne "10.0.302") {
            throw "Expected .NET SDK 10.0.302."
          }
          $sdkPath = (dotnet msbuild sample_projects/simple.proj -nologo -getProperty:MSBuildSDKsPath).Trim()
          Write-Host "MSBuildSDKsPath=$sdkPath"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Compare evaluation compatibility fixtures
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { "target/debug/msbuild-rs.exe" } else { "target/debug/msbuild-rs" }
          ./scripts/run-compatibility-fixtures.ps1 -RustExecutable $executable

      - name: Verify generated performance fixture smoke case
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $generated = "benchmark-results/generated-smoke"
          ./scripts/generate-performance-fixtures.ps1 -Preset Smoke -OutputDirectory $generated
          ./scripts/generate-performance-fixtures.ps1 -OutputDirectory $generated -VerifyOnly
          $manifest = Get-Content -Raw "$generated/manifest.json" | ConvertFrom-Json
          $fixture = $manifest.cases | Where-Object name -eq "representative"
          ./scripts/compare-preprocess.ps1 `
            -Project (Join-Path $generated $fixture.project) `
            -FixtureName $fixture.name `
            -FixtureHash $fixture.fixtureHash `
            -FixtureManifestPath (Join-Path $generated "manifest.json") `
            -FixtureManifestCase $fixture.name `
            -RustExecutable target/debug/msbuild-rs `
            -OutputDirectory benchmark-results/generated-smoke-parity `
            -ParityOnly

      - name: Test path normalization
        shell: pwsh
        run: |
          ./scripts/tests/path-normalization.tests.ps1
          ./scripts/tests/performance-fixture-identity.tests.ps1
          ./scripts/tests/preprocess-semantic-xml.tests.ps1

      - name: Run demo mode
        run: cargo run -- --demo
        timeout-minutes: 5

      - name: Test individual sample projects
        run: |
          cargo run -- --project sample_projects/simple.proj --target Build --verbose
          cargo run -- --project sample_projects/conditional.proj --target Test --verbose
          cargo run -- --project sample_projects/with_imports.proj --target Build --verbose

      - name: Security audit (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Generate documentation (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo doc --all-features --no-deps
          cargo doc --all-features --no-deps 2>&1 | grep -q "warning" && exit 1 || exit 0

      - name: Integration tests (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Test error handling
          ! cargo run -- --project non-existent.proj --target Build

          # Test verbose mode
          cargo run -- --demo --verbose

          # Test different targets
          cargo run -- --project sample_projects/conditional.proj --target Build --verbose

          # Verify sample project files exist
          test -f sample_projects/simple.proj
          test -f sample_projects/conditional.proj
          test -f sample_projects/with_imports.proj
          test -f sample_projects/common.props

          # Test project file parsing (if xmllint is available)
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout sample_projects/*.proj
            xmllint --noout sample_projects/*.props
          fi

      - name: Upload documentation artifact (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: target/doc/
