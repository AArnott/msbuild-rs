name: Preprocess performance

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Generated fixture scale
        required: true
        default: Benchmark
        type: choice
        options:
          - Benchmark
          - Smoke
      iterations:
        description: Measured iterations per implementation
        required: true
        default: "30"
        type: string
      warmups:
        description: Warmup iterations per implementation
        required: true
        default: "5"
        type: string
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: preprocess-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
          global-json-file: global.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: performance-${{ matrix.os }}

      - name: Build release executable
        run: cargo build --release --locked

      - name: Run parity-gated performance suite
        shell: pwsh
        env:
          PERFORMANCE_PRESET: ${{ inputs.preset || 'Benchmark' }}
          PERFORMANCE_ITERATIONS: ${{ inputs.iterations || '30' }}
          PERFORMANCE_WARMUPS: ${{ inputs.warmups || '5' }}
        run: |
          $iterations = [int]$env:PERFORMANCE_ITERATIONS
          $warmups = [int]$env:PERFORMANCE_WARMUPS
          $executable = if ($IsWindows) { "target/release/msbuild-rs.exe" } else { "target/release/msbuild-rs" }
          ./scripts/run-performance-suite.ps1 `
            -Preset $env:PERFORMANCE_PRESET `
            -Iterations $iterations `
            -Warmup $warmups `
            -RustExecutable $executable `
            -OutputDirectory benchmark-results/performance

      - name: Upload raw performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preprocess-performance-${{ runner.os }}-${{ runner.arch }}
          path: benchmark-results/performance/
          if-no-files-found: error
          retention-days: 30
