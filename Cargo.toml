[package]
name = "msbuild-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
quick-xml = "0.41.0"
clap = { version = "4.6.6", features = ["derive"] }
log = "0.4.33"
env_logger = "0.11.11"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
indexmap = "2.14.0"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[dev-dependencies]
tempfile = "3.27.0"
